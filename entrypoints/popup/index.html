<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Trade Journal</title>
    <style>
      /*
       * Fixed size: if the document grows or loses its scrollbar (Radix scroll lock),
       * Chrome resizes the popup window, and Radix Select/Dropdown close on resize.
       * The app scrolls inside #root instead.
       */
      html,
      body {
        width: 380px;
        height: 600px;
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
